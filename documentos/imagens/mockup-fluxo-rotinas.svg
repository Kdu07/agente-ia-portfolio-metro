<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".12"/></filter></defs>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.label{font-size:14px;font-weight:700;fill:#0875c9}.title{font-size:22px;font-weight:700}.small{font-size:12px;fill:#667085}.tiny{font-size:10px;fill:#667085}.card{fill:#fff;stroke:#e2e7ef}.blue{fill:#0875c9}.soft{fill:#f4f7fa}.green{fill:#e0f7ee}.red{fill:#fee4e2}</style>
  <rect width="1600" height="1080" fill="#eef3f8"/><text x="55" y="55" font-size="30" font-weight="700">Prata Agent — Fluxo visual de Rotinas</text><text class="small" x="55" y="82">Listagem, criação, edição, validação, exclusão, sucesso e estado vazio</text>
  <g transform="translate(55 120)" filter="url(#s)"><rect class="card" width="720" height="390" rx="16"/><text class="label" x="24" y="34">01 · LISTAGEM E FILTROS</text><text class="title" x="24" y="70">Gerencie suas rotinas</text><rect class="blue" x="555" y="30" width="140" height="42" rx="8"/><text x="579" y="56" font-size="13" font-weight="700" fill="#fff">+ Nova rotina</text><rect class="soft" x="24" y="92" width="671" height="58" rx="9"/><rect class="card" x="38" y="105" width="340" height="32" rx="6"/><text class="small" x="54" y="126">Buscar por nome, ação ou intenção</text><rect class="card" x="391" y="105" width="130" height="32" rx="6"/><text class="small" x="406" y="126">Status: Todas</text><rect class="card" x="534" y="105" width="146" height="32" rx="6"/><text class="small" x="549" y="126">Próxima execução</text><g transform="translate(24 170)"><rect class="card" width="671" height="92" rx="10"/><circle cx="18" cy="23" r="5" fill="#17b67a"/><text x="34" y="28" font-size="14" font-weight="700">Riscos da Linha 6</text><rect class="green" x="178" y="12" width="52" height="22" rx="11"/><text x="191" y="27" font-size="10" fill="#087a55">Ativa</text><text class="small" x="34" y="52">Listar riscos críticos sem atualização há mais de sete dias.</text><text class="tiny" x="34" y="76">SEG. A SEX., 08:00</text><text class="tiny" x="245" y="76">PRÓXIMA: 27 AGO., 08:00</text><text x="560" y="54" font-size="11" fill="#0875c9">Editar</text><text x="615" y="54" font-size="11" fill="#b42318">Excluir</text></g><g transform="translate(24 276)"><rect class="card" width="671" height="92" rx="10"/><circle cx="18" cy="23" r="5" fill="#98a2b3"/><text x="34" y="28" font-size="14" font-weight="700">Revisão mensal de marcos</text><rect class="soft" x="220" y="12" width="62" height="22" rx="11"/><text class="tiny" x="232" y="27">Pausada</text><text class="small" x="34" y="52">Identificar marcos atrasados para a reunião do PMO.</text><text class="tiny" x="34" y="76">TODO DIA 5, 17:00</text></g></g>
  <g transform="translate(825 120)" filter="url(#s)"><rect class="card" width="720" height="390" rx="16"/><rect x="0" y="0" width="720" height="390" rx="16" fill="#172033" opacity=".25"/><rect class="card" x="120" y="35" width="480" height="320" rx="14"/><text class="label" x="145" y="68">02 · CRIAÇÃO / EDIÇÃO</text><text class="title" x="145" y="101">Criar rotina</text><text class="small" x="145" y="129">Nome da rotina *</text><rect class="card" x="145" y="140" width="430" height="36" rx="6"/><text class="small" x="160" y="163">Resumo diário de pendências</text><text class="small" x="145" y="199">Ação em linguagem natural *</text><rect class="card" x="145" y="210" width="430" height="66" rx="6"/><text class="small" x="160" y="235">Listar pendências críticas dos projetos ativos</text><text class="small" x="145" y="297">Agendamento</text><rect class="card" x="145" y="306" width="185" height="34" rx="6"/><text class="small" x="160" y="328">0 8 * * 1-5</text><rect class="blue" x="445" y="299" width="130" height="42" rx="7"/><text x="471" y="325" font-size="12" font-weight="700" fill="#fff">Criar rotina</text></g>
  <g transform="translate(55 550)" filter="url(#s)"><rect class="card" width="460" height="390" rx="16"/><text class="label" x="24" y="34">03 · VALIDAÇÃO</text><text class="title" x="24" y="70">Revise os campos</text><text class="small" x="24" y="102">Nome da rotina *</text><rect x="24" y="114" width="412" height="38" rx="6" fill="#fff" stroke="#d92d20"/><text class="small" x="39" y="138">A</text><text x="24" y="172" font-size="11" fill="#b42318">Informe um nome com pelo menos 3 caracteres.</text><text class="small" x="24" y="207">Ação em linguagem natural *</text><rect x="24" y="219" width="412" height="70" rx="6" fill="#fff" stroke="#d92d20"/><text x="24" y="310" font-size="11" fill="#b42318">Descreva a ação com pelo menos 10 caracteres.</text><rect class="blue" x="300" y="330" width="136" height="38" rx="7"/><text x="326" y="354" font-size="12" font-weight="700" fill="#fff">Criar rotina</text></g>
  <g transform="translate(555 550)" filter="url(#s)"><rect class="card" width="460" height="390" rx="16"/><text class="label" x="24" y="34">04 · CONFIRMAÇÃO DE EXCLUSÃO</text><circle cx="230" cy="116" r="35" fill="#fee4e2"/><text x="224" y="127" font-size="28" font-weight="700" fill="#b42318">!</text><text class="title" x="158" y="180">Excluir rotina?</text><text class="small" x="68" y="214">A rotina e seu agendamento serão removidos.</text><text class="small" x="130" y="234">Esta ação não poderá ser desfeita.</text><rect class="card" x="68" y="285" width="150" height="42" rx="7"/><text x="117" y="311" font-size="12" font-weight="700">Cancelar</text><rect x="242" y="285" width="150" height="42" rx="7" fill="#c4322b"/><text x="276" y="311" font-size="12" font-weight="700" fill="#fff">Excluir rotina</text></g>
  <g transform="translate(1055 550)" filter="url(#s)"><rect class="card" width="490" height="390" rx="16"/><text class="label" x="24" y="34">05 · VAZIO E FEEDBACK</text><circle cx="245" cy="128" r="38" fill="#eaf5fd"/><text x="233" y="140" font-size="32" fill="#0875c9">◇</text><text class="title" x="144" y="193">Crie sua primeira rotina</text><text class="small" x="94" y="222">Automatize uma consulta recorrente do portfólio.</text><rect class="blue" x="175" y="249" width="140" height="42" rx="7"/><text x="204" y="275" font-size="12" font-weight="700" fill="#fff">Criar rotina</text><rect x="102" y="322" width="286" height="44" rx="9" fill="#effbf6" stroke="#a9e5cc"/><circle cx="128" cy="344" r="11" fill="#17a873"/><text x="124" y="348" font-size="11" fill="#fff">✓</text><text x="149" y="349" font-size="12" font-weight="700" fill="#086645">Rotina criada com sucesso.</text></g>
  <text class="small" x="55" y="1000">Handoff: os estados representados correspondem aos componentes implementados no frontend; a persistência depende do CRUD do FastAPI.</text><text class="small" x="55" y="1025">Figma e aprovação formal: pendentes de registro.</text>
</svg>
