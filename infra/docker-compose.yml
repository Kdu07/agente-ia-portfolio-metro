# Ambiente de desenvolvimento local: middleware + banco de auditoria.
# Uso: docker compose -f infra/docker-compose.yml up
services:
  middleware:
    build: ../src/middleware
    ports:
      - "8000:8000"
    env_file:
      - ../src/middleware/.env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: middleware
      POSTGRES_PASSWORD: middleware
      POSTGRES_DB: middleware
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
