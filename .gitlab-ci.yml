mover-para-review-e-fechar:
  extends: .mover
  variables:
    GIT_STRATEGY: none
    ORIGEM: "Waiting Review"
  script:
    - 'test -n "$ISSUE"'
    - 'ESTADO=$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $AGENDA_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE")'
    - 'echo "$ESTADO" | jq -e --arg origem "$ORIGEM" ''.state == "opened" and any(.labels[]; . == $origem)'' > /dev/null || { echo "issue #$ISSUE fora de $ORIGEM: nada a fazer"; exit 0; }'
    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $AGENDA_TOKEN" --data-urlencode "add_labels=Review" --data-urlencode "remove_labels=Waiting Review" --data-urlencode "state_event=close" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE" > /dev/null'
    - 'echo "issue #$ISSUE: Waiting Review -> Review e fechada"'
  rules:
    - if: '$AGENDA_KEY == "CLOSE_5"'
      when: delayed
      start_in: 5 minutes
    - if: '$AGENDA_KEY == "CLOSE_10"'
      when: delayed
      start_in: 10 minutes
