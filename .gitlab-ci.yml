# Pipeline de verificação: análise estática, tipos e testes das duas aplicações
# a cada merge request. Com "Pipelines must succeed" ligado no projeto, qualquer
# job vermelho impede o merge. Ver Projeto.md 10.5.8.
#
# A automação do board não mora aqui: ela vive na branch órfã `ci/agenda-cadu`,
# que tem o próprio `.gitlab-ci.yml` e nenhum ancestral comum com este.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Push em branch com MR aberto já dispara a pipeline do MR; sem esta regra
    # cada push rodaria tudo duas vezes.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - lint
  - teste

default:
  interruptible: true

# === Middleware (Python) ===

.middleware:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: pip-$CI_JOB_NAME
    paths:
      - .cache/pip
  before_script:
    - cd src/middleware

middleware:ruff:
  extends: .middleware
  stage: lint
  script:
    # Só o ruff, na mesma faixa do extra `dev`: instalar o projeto inteiro
    # (torch incluso) para rodar um linter custaria minutos.
    - pip install "ruff>=0.16,<0.17"
    - ruff check .

middleware:pytest:
  extends: .middleware
  stage: teste
  timeout: 30m
  services:
    - name: postgres:16-alpine
      alias: db
    # Mesma imagem e credenciais padrão do compose. Os testes de mensageria
    # criam um vhost descartável pela API de gerenciamento (porta 15672).
    - name: rabbitmq:4.3.6-management-alpine
      alias: rabbitmq
      variables:
        RABBITMQ_DEFAULT_USER: prata
        RABBITMQ_DEFAULT_PASS: prata-local
        RABBITMQ_DEFAULT_VHOST: prata
  variables:
    POSTGRES_USER: middleware
    POSTGRES_PASSWORD: middleware
    POSTGRES_DB: middleware
    DATABASE_URL: "postgresql+asyncpg://middleware:middleware@db:5432/middleware"
    HF_HOME: $CI_PROJECT_DIR/.cache/hf
  script:
    # ffmpeg: app/voz/midia.py valida os áudios com ffprobe.
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg
    # torch CPU antes do resto, como no Dockerfile: sem isso o
    # sentence-transformers puxa os wheels CUDA.
    - pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.2"
    - pip install -e ".[dev,rag]"
    # O TF-RF03-01 classifica com o artefato treinado de verdade, que depende
    # do modelo de sentenças. Baixado aqui, como no Dockerfile, porque dentro
    # do pytest o --block-network o impediria.
    - python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('intfloat/multilingual-e5-large')"
    - alembic upgrade head
    # --block-network barra qualquer chamada real que escape das fitas VHS; os
    # dois serviços são as únicas exceções. A CI não tem credencial de
    # provedor, então os testes de tests/integration/externos pulam pela chave
    # ausente.
    - DB_IP=$(getent hosts db | cut -d' ' -f1)
    - RABBITMQ_IP=$(getent hosts rabbitmq | cut -d' ' -f1)
    # Offline só a partir daqui: o modelo já está em HF_HOME, e um teste que
    # tente baixar outro falha em vez de sair para a rede.
    - export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 RABBITMQ_HOST=rabbitmq
    # `python -m`, e não o executável `pytest`: só assim o diretório atual entra
    # no sys.path, e os testes importam `tests.apoio_audio`.
    - python -m pytest --block-network --allowed-hosts="127.0.0.1,$DB_IP,$RABBITMQ_IP"
      --benchmark-disable -p no:cacheprovider --junitxml=relatorio-pytest.xml
  artifacts:
    when: always
    reports:
      junit: src/middleware/relatorio-pytest.xml

# === Interface (React) ===

.web:
  image: node:20-alpine
  cache:
    key:
      files:
        - src/web/package-lock.json
    paths:
      - src/web/.npm
  before_script:
    - cd src/web
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

web:eslint:
  extends: .web
  stage: lint
  script:
    - npm run lint

web:tipos:
  extends: .web
  stage: lint
  script:
    - npm run typecheck

web:vitest:
  extends: .web
  stage: teste
  script:
    - npm run test -- --reporter=default --reporter=junit --outputFile.junit=relatorio-vitest.xml
  artifacts:
    when: always
    reports:
      junit: src/web/relatorio-vitest.xml
