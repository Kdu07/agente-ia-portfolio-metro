mover-para-review:
  extends: .mover
  variables:
    GIT_STRATEGY: none
    ORIGEM: "Doing"
  script:
    - 'test -n "$ISSUE"'
    - 'ESTADO=$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $AGENDA_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE")'
    - 'echo "$ESTADO" | jq -e --arg origem "$ORIGEM" ''.state == "opened" and any(.labels[]; . == $origem)'' > /dev/null || { echo "issue #$ISSUE fora de $ORIGEM: nada a fazer"; exit 0; }'
    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $AGENDA_TOKEN" --data-urlencode "add_labels=Waiting Review" --data-urlencode "remove_labels=Doing" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE" > /dev/null'
    - 'echo "issue #$ISSUE: Doing -> Waiting Review"'
  rules:
    - if: '$AGENDA_KEY == "REVIEW_1"'
      when: delayed
      start_in: 1 minutes
    - if: '$AGENDA_KEY == "REVIEW_2"'
      when: delayed
