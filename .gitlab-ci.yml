fechar-apos-review:
  extends: .mover
  variables:
    GIT_STRATEGY: none
    ORIGEM: "Review"
  script:
    - 'test -n "$ISSUE"'
    - 'ESTADO=$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $AGENDA_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE")'
    - 'echo "$ESTADO" | jq -e --arg origem "$ORIGEM" ''.state == "opened" and any(.labels[]; . == $origem)'' > /dev/null || { echo "issue #$ISSUE fora de $ORIGEM: nada a fazer"; exit 0; }'
    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $AGENDA_TOKEN" --data-urlencode "state_event=close" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE" > /dev/null'
    - 'echo "issue #$ISSUE: Review -> fechada"'
  rules:
    - if: '$AGENDA_KEY == "CLOSE_1"'
      when: delayed
      start_in: 1 minutes
