# Verificação e entrega contínua. Em cada merge request: análise estática,
# tipos e testes das duas aplicações; com "Pipelines must succeed" ligado no
# projeto, qualquer job vermelho impede o merge (Projeto.md 10.5.8). Na
# develop, depois dos testes, as imagens vão para o registro e o dev é
# atualizado; na main, as imagens são publicadas e o prd espera um clique
# (Projeto.md 11.2).
#
# Poucos jobs por pipeline: desde 06/10/2026 a instância do GitLab recusa
# criar a pipeline quando o projeto passaria de 5 jobs em pipelines ativas
# ("pipeline job activity limit"), e a recusa não entra em fila. Por isso as
# verificações de cada aplicação dividem um job, e cada etapa anota a falha
# em FALHAS em vez de parar o job: a última linha reprova com a lista.
#
# A automação do board não mora aqui: ela vive na branch órfã `ci/agenda-cadu`,
# que tem o próprio `.gitlab-ci.yml` e nenhum ancestral comum com este.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A develop e a main rodam mesmo com MR aberto (a develop → main do fim
    # da sprint): é a pipeline de branch que implanta. Outras branches só têm
    # a pipeline do MR, para cada push não rodar tudo duas vezes.
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    # Disparo manual: "Run pipeline" na interface (web) ou `glab ci run`
    # (api). Com IMPLANTAR=dev, a branch escolhida vai para o dev, se a
    # identidade do dev aceitar aquele ramo (fase pipeline do provisionar.sh).
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

stages:
  - teste
  - imagens
  - implantar

default:
  interruptible: true

# === Middleware (Python), com a interface contra ele vivo ===
#
# Ruff, a suíte do pytest e a integração (#471) num job só. A integração vem
# junto porque precisa da mesma instalação (torch, e5-large) e do mesmo
# PostgreSQL; ela usa um banco criado na hora, porque a carga do
# `popular_banco` exige banco novo e o pytest já passou pelo `middleware`.

middleware:
  image: python:3.12-slim
  stage: teste
  timeout: 45m
  services:
    - name: postgres:16-alpine
      alias: db
    # Mesma imagem e credenciais padrão do compose. Os testes de mensageria
    # criam um vhost descartável pela API de gerenciamento (porta 15672).
    - name: rabbitmq:4.3.6-management-alpine
      alias: rabbitmq
      variables:
        RABBITMQ_DEFAULT_USER: prata
        RABBITMQ_DEFAULT_PASS: prata-local
        RABBITMQ_DEFAULT_VHOST: prata
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    POSTGRES_USER: middleware
    POSTGRES_PASSWORD: middleware
    POSTGRES_DB: middleware
    DATABASE_URL: "postgresql+asyncpg://middleware:middleware@db:5432/middleware"
    HF_HOME: $CI_PROJECT_DIR/.cache/hf
    NODE_VERSION: "20.19.5"
    INTEGRACAO_SESSOES: $CI_PROJECT_DIR/sessoes-integracao.json
  cache:
    - key: pip-$CI_JOB_NAME
      paths:
        - .cache/pip
    - key:
        files:
          - src/web/package-lock.json
      paths:
        - src/web/.npm
  before_script:
    - cd src/middleware
  script:
    # ffmpeg: app/voz/midia.py valida os áudios com ffprobe. curl e xz: o
    # Node da integração entra pelo tarball oficial.
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg curl xz-utils
    - curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" | tar -xJ -C /usr/local --strip-components=1
    - node --version
    # torch CPU antes do resto, como no Dockerfile: sem isso o
    # sentence-transformers puxa os wheels CUDA.
    - pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.2"
    - pip install -e ".[dev,rag]"
    # O ruff vem do extra `dev`, na faixa travada ali.
    - ruff check . || FALHAS="$FALHAS ruff"
    # O TF-RF03-01 classifica com o artefato treinado de verdade, que depende
    # do modelo de sentenças. Baixado aqui, como no Dockerfile, porque dentro
    # do pytest o --block-network o impediria. A revisão é a de
    # REVISAO_EMBEDDINGS em app/pipeline/intencao/modelo.py.
    - python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('intfloat/multilingual-e5-large', revision='3d7cfbdacd47fdda877c5cd8a79fbcc4f2a574f3')"
    - alembic upgrade head
    # --block-network barra qualquer chamada real que escape das fitas VHS; os
    # dois serviços são as únicas exceções. A CI não tem credencial de
    # provedor, então os testes de tests/integration/externos pulam pela chave
    # ausente. O modo offline e o RABBITMQ_HOST valem só para o pytest: um
    # teste que tente baixar outro modelo falha em vez de sair para a rede.
    - DB_IP=$(getent hosts db | cut -d' ' -f1)
    - RABBITMQ_IP=$(getent hosts rabbitmq | cut -d' ' -f1)
    # `python -m`, e não o executável `pytest`: só assim o diretório atual entra
    # no sys.path, e os testes importam `tests.apoio_audio`.
    - HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 RABBITMQ_HOST=rabbitmq
      python -m pytest --block-network --allowed-hosts="127.0.0.1,$DB_IP,$RABBITMQ_IP"
      --benchmark-disable -p no:cacheprovider --junitxml=relatorio-pytest.xml
      || FALHAS="$FALHAS pytest"

    # --- Interface contra o middleware vivo (#471, Projeto.md 10.5.5.8) ---
    # As telas renderizadas no Vitest falam com um uvicorn de verdade, com
    # PostgreSQL, a carga do `popular_banco` e o pipeline inteiro; uma ponte
    # no MSW faz o papel do proxy do Vite (src/web/src/testes/integracao/ponte.ts).
    - |
      python -c '
      import asyncio, asyncpg
      async def criar():
          conexao = await asyncpg.connect("postgresql://middleware:middleware@db:5432/middleware")
          await conexao.execute("CREATE DATABASE integracao")
          await conexao.close()
      asyncio.run(criar())
      '
    - export DATABASE_URL="postgresql+asyncpg://middleware:middleware@db:5432/integracao"
    # Executor sintético: o /chat percorre guardas, classificador e
    # persistência sem gastar provedor de LLM. O classificador carrega numa
    # thread e /health/pronto só responde 200 depois; a suíte espera por ele
    # em vez de o primeiro /chat esperar.
    - export PERFORMANCE_MODE=true AQUECER_MODELOS=true
    # Segredo gerado aqui e descartado com o job: nenhum literal no
    # repositório, e o mesmo valor serve às sessões e ao uvicorn.
    - export SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
    - alembic upgrade head
    - python -m scripts.popular_banco
    - python -m scripts.sessoes_integracao --saida "$INTEGRACAO_SESSOES"
    - export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
    - uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$CI_PROJECT_DIR/uvicorn.log" 2>&1 &
    - UVICORN=$!
    # Até 5 min pelo aquecimento; se o processo morrer antes, o log diz por quê.
    - |
      for tentativa in $(seq 1 60); do
        curl -fsS http://127.0.0.1:8000/health/pronto > /dev/null 2>&1 && break
        kill -0 "$UVICORN" 2> /dev/null || { tail -n 50 "$CI_PROJECT_DIR/uvicorn.log"; exit 1; }
        sleep 5
      done
    - curl -fsS http://127.0.0.1:8000/health/pronto
    - cd ../web
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run test:integracao -- --reporter=default --reporter=junit --outputFile.junit=relatorio-integracao.xml
      || FALHAS="$FALHAS integracao"
    - test -z "$FALHAS" || { echo "Falharam:$FALHAS"; exit 1; }
  artifacts:
    when: always
    reports:
      junit:
        - src/middleware/relatorio-pytest.xml
        - src/web/relatorio-integracao.xml
    # O arquivo de sessões fica de fora: ele carrega os cookies.
    paths:
      - uvicorn.log
    expire_in: 30 days

# === Interface (React) ===

web:
  image: node:20-alpine
  stage: teste
  cache:
    key:
      files:
        - src/web/package-lock.json
    paths:
      - src/web/.npm
  before_script:
    - cd src/web
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - npm run lint || FALHAS="$FALHAS eslint"
    - npm run typecheck || FALHAS="$FALHAS tipos"
    - npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=relatorio-vitest.xml
      || FALHAS="$FALHAS vitest"
    - test -z "$FALHAS" || { echo "Falharam:$FALHAS"; exit 1; }
  artifacts:
    when: always
    reports:
      junit: src/web/relatorio-vitest.xml
      coverage_report:
        coverage_format: cobertura
        path: src/web/coverage/cobertura-coverage.xml
    paths:
      - src/web/coverage/
    expire_in: 30 days

# === Entrega contínua (Azure) ===
#
# Sem segredo guardado no GitLab: o job recebe um token OIDC, e a Azure o
# troca por acesso à identidade id-prata-ci-<estágio>, que só aceita tokens
# deste projeto vindos do ramo do estágio. AZURE_CLIENT_ID tem escopo de
# ambiente (dev ou prd); AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID valem para
# os dois. Nenhuma das três é sigilosa.

.azure:
  image: mcr.microsoft.com/azure-cli:2.90.0
  # Um deploy cancelado no meio deixaria a migração feita e a imagem velha.
  interruptible: false
  id_tokens:
    AZURE_JWT:
      aud: api://AzureADTokenExchange
  variables:
    # A mesma tag no build e no deploy; o variaveis.sh a respeita.
    TAG: $CI_COMMIT_SHORT_SHA
  before_script:
    - command -v curl >/dev/null || tdnf install -y -q curl
    - az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID"
      --federated-token "$AZURE_JWT" -o none
    - az account set -s "$AZURE_SUBSCRIPTION_ID"

.dev:
  variables:
    ESTAGIO: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $IMPLANTAR == "dev"

.prd:
  variables:
    ESTAGIO: prd
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"

# O mesmo `provisionar.sh imagens` da máquina, contra um Docker do serviço.
# O CLI entra como binário estático, e o builder clássico dispensa o buildx.
.imagens:
  extends: .azure
  stage: imagens
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "0"
  script:
    - command -v tar >/dev/null || tdnf install -y -q tar gzip
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz
      | tar xz --strip-components=1 -C /usr/local/bin docker/docker
    - bash infra/azure/provisionar.sh "$ESTAGIO" imagens

# Migração, troca de imagem e verificação de saúde. Código 3 é o banco
# parado: nada foi implantado, e a pipeline mostra aviso em vez de falha.
.implantar:
  extends: .azure
  stage: implantar
  allow_failure:
    exit_codes: [3]
  script:
    - bash infra/azure/implantar.sh "$ESTAGIO"

# No dev, imagens e implantação num job só, pelo limite de jobs ativos.
entrega:dev:
  extends: [.imagens, .implantar, .dev]
  resource_group: azure-dev
  environment:
    name: dev
    url: https://ca-web-dev.wittywater-1f84aed4.brazilsouth.azurecontainerapps.io
  script:
    - !reference [.imagens, script]
    - !reference [.implantar, script]

# Na main a pipeline é rara e o prd espera um clique: os dois jobs seguem
# separados, e as imagens ficam prontas antes do clique.
imagens:prd:
  extends: [.imagens, .prd]
  environment:
    name: prd
    action: prepare

# Produção só com clique: a semana é curta, e um deploy a cada merge na main
# arriscaria derrubar o ambiente de demonstração.
implantar:prd:
  extends: [.implantar, .prd]
  resource_group: azure-prd
  environment:
    name: prd
    url: https://ca-web-prd.wittywater-1f84aed4.brazilsouth.azurecontainerapps.io
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
      when: manual
