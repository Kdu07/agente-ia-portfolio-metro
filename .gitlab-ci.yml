  extends: .mover
  script:
    - 'test -n "$ISSUE"'
    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $AGENDA_TOKEN" --data-urlencode "remove_labels=Review,Waiting Review,Doing" --data-urlencode "state_event=close" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE" > /dev/null'
