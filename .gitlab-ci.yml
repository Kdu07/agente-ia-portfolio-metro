# Agendamento server-side das transicoes do Scrum Board.
#
# ARQUIVO GERADO por .claude/scripts/gerar-agenda.py. Vive na branch orfa
# `ci/agenda` e nao interfere com a pipeline real do projeto.
#
# Disparo:
#   glab ci run -b ci/agenda --variables AGENDA_KEY:DOING_120,ISSUE:366
#   glab ci run -b ci/agenda --variables AGENDA_KEY:REVIEW_180,ISSUE:366
#   glab ci run -b ci/agenda --variables AGENDA_KEY:CLOSE_120,ISSUE:366
#
#   glab ci run -b ci/agenda --variables AGENDA_KEY:REVISAR_30,ISSUE:366
#
# O numero na chave e o atraso em minutos, de 1 a 720.
#
# Cada job so age se o card estiver na coluna de origem esperada; do
# contrario, termina sem alterar nada. Um agendamento nunca faz um card
# voltar no board.
#
# Pre-requisito: Project Access Token com escopo `api` e papel Reporter ou
# superior, na variavel mascarada AGENDA_TOKEN. O CI_JOB_TOKEN nao altera
# issues.

stages:
  - agenda

.mover:
  stage: agenda
  image: alpine:3
  interruptible: false
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq

mover-para-doing:
  extends: .mover
  variables:
    GIT_STRATEGY: none
    ORIGEM: "Backlog"
  script:
    - 'test -n "$ISSUE"'
    - 'ESTADO=$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $AGENDA_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE")'
    - 'echo "$ESTADO" | jq -e --arg origem "$ORIGEM" ''.state == "opened" and any(.labels[]; . == $origem)'' > /dev/null || { echo "issue #$ISSUE fora de $ORIGEM: nada a fazer"; exit 0; }'
    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $AGENDA_TOKEN" --data-urlencode "add_labels=Doing" --data-urlencode "remove_labels=Backlog" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE" > /dev/null'
    - 'echo "issue #$ISSUE: Backlog -> Doing"'
  rules:
    - if: '$AGENDA_KEY == "DOING_1"'
      when: delayed
      start_in: 1 minutes
    - if: '$AGENDA_KEY == "DOING_2"'
      when: delayed
      start_in: 2 minutes
    - if: '$AGENDA_KEY == "DOING_3"'
      when: delayed
      start_in: 3 minutes
    - if: '$AGENDA_KEY == "DOING_4"'
      when: delayed
      start_in: 4 minutes
