# Agendamento server-side das transicoes do board.
#
# ARQUIVO GERADO por .claude/scripts/gerar-agenda.py - nao edite na mao, a
# proxima geracao desfaz. Vive na branch orfa `ci/agenda-cadu`, que tem este
# unico arquivo e nenhum ancestral comum com o resto do repositorio: nao polui a
# pipeline do projeto, nao dispara em push e nunca aparece como origem de MR.
#
# Disparo:
#   glab ci run -b ci/agenda-cadu --variables AGENDA_KEY:DOING_60,ISSUE:412   # Backlog -> Doing
#   glab ci run -b ci/agenda-cadu --variables AGENDA_KEY:REVIEW_60,ISSUE:412  # Doing -> Waiting Review
#   glab ci run -b ci/agenda-cadu --variables AGENDA_KEY:CLOSE_60,ISSUE:412   # sai da coluna e fecha a issue
#
# O numero na chave e o atraso em minutos, de 5 em 5, ate 720.
#
# Pre-requisito: Project Access Token com escopo `api` e papel Reporter ou
# superior, na variavel mascarada AGENDA_TOKEN, **nao-protected** (esta branch
# nao e protegida; marcada como protected, o job recebe vazio e falha com 401).
# O CI_JOB_TOKEN nao serve: nao tem permissao para alterar issues.

stages:
  - agenda

.mover:
  stage: agenda
  image: alpine:3
  interruptible: false          # pipeline nova nao cancela agendamento pendente
  variables:
    GIT_STRATEGY: none          # nao precisa clonar o repo
  before_script:
    - apk add --no-cache curl


# Backlog -> Doing
mover-para-doing:
  extends: .mover
  script:
    - 'test -n "$ISSUE"'
    - 'curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $AGENDA_TOKEN" --data-urlencode "add_labels=Doing" --data-urlencode "remove_labels=Backlog" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$ISSUE" > /dev/null'
    - 'echo "issue #$ISSUE: Backlog -> Doing"'
  rules:
    - if: '$AGENDA_KEY == "DOING_5"'
