# Serve os estaticos do React e faz proxy de /api para o middleware.
#
# Navegador e API na MESMA ORIGEM: e isso que permite ao cookie de sessao
# httpOnly viajar sem CORS e sem excecao de SameSite. Servir o frontend
# de um dominio e a API de outro exigiria SameSite=None, que enfraquece
# exatamente a protecao que o cookie deveria dar.
#
# Este arquivo e um TEMPLATE da imagem oficial do nginx: o Dockerfile o
# copia para /etc/nginx/templates/, e na subida o entrypoint troca
# ${API_UPSTREAM} pelo valor do ambiente. So variaveis de ambiente
# definidas sao trocadas; as do nginx ($host, $scheme...) ficam intactas.

# O ingress do Container Apps termina o TLS e fala HTTP com o nginx, entao
# $scheme aqui e sempre "http". O protocolo real do navegador chega no
# X-Forwarded-Proto do ingress, e e ele que segue para o middleware.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida devolve o index, e o react-router
    # resolve no cliente. Sem isso, recarregar a pagina em /rotinas da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Arquivo de até 25 MiB mais o envelope multipart; a API valida o arquivo.
        client_max_body_size 26m;
        # `middleware:8000` no compose; o nome do app no Container Apps.
        proxy_pass http://${API_UPSTREAM}/;
        # O Container Apps escolhe o app de destino pelo Host. Mandar o
        # dominio publico ($host) faria o ambiente responder 404; o nome
        # do upstream ($proxy_host) e o que ele reconhece.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;

        # O /chat entrega a resposta por SSE. Sem desligar o buffer, o
        # nginx segura os eventos e o streaming chega de uma vez so.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
