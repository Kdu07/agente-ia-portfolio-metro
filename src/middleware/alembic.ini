# Configuração do Alembic.
#
# A URL do banco NÃO fica aqui: este arquivo é versionado e a URL carrega
# credenciais. `migrations/env.py` lê settings.database_url do ambiente,
# como todo o resto da aplicação.

[alembic]
script_location = migrations
prepend_sys_path = .
# Prefixo de data no nome do arquivo: com seis pessoas criando migrações
# em branches diferentes, a ordem cronológica no diretório é o que torna
# um conflito de head visível na revisão.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = America/Sao_Paulo

# Formata a revisão recém-gerada. O tipo é `exec` e não `console_scripts`
# porque o wheel do ruff instala um binário nativo e não declara nenhum
# entrypoint — `console_scripts` falha com "Could not find entrypoint".
# Invocar por `python -m ruff` mantém o hook funcionando tanto no venv
# do Windows quanto na imagem Linux do docker-compose.
[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = python
ruff.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
