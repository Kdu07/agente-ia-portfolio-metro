# Sem build-system, `pip install -e .` não tem como construir o pacote e
# falha sem instalar nada — inclusive as dependências.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# O pacote é `app`; `dados/` e `tests/` ficam de fora do que se instala.
[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "middleware-pln"
version = "0.2.0"
description = "Middleware do Agente de Portfólio - Metrô SP (g02)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # Persistência: interações, conversas, rotinas e jobstore do agendador
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Agendador das rotinas. O jobstore SQLAlchemy usa o mesmo PostgreSQL,
    # o que evita Redis ou outro broker só para a agenda.
    "apscheduler>=3.10,<4",
    # Fluxo Authorization Code + PKCE contra o Entra ID
    "msal>=1.28",
    # Assinatura do cookie de sessão
    "itsdangerous>=2.2",
    # Classificador de intenção. scikit-learn cobre a vetorização
    # (BoW/TF-IDF) e os estimadores; sentence-transformers traz o modelo
    # de sentença multilíngue do ramo de embeddings; joblib serializa o
    # artefato treinado. Ver pipeline/intencao/modelo.py.
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "joblib>=1.4",
    # Reconhecimento de fala no backend. A integração isolada aceita WAV;
    # formatos comprimidos entram na etapa de processamento de áudio.
    "azure-cognitiveservices-speech>=1.51,<2",
]

[project.optional-dependencies]
# Banco vetorial do executor próprio. Extra, e não dependência base,
# porque o caminho oficial (executor=copilot) não indexa nada e não deve
# arrastar o SDK do provedor. O adaptador de reserva não aparece aqui: o
# pgvector é uma extensão do servidor, e rag/vetorial/pgvector.py fala
# apenas SQL pelo SQLAlchemy que já está na base.
rag = [
    "pinecone>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
