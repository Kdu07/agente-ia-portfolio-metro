[project]
name = "middleware-pln"
version = "0.2.0"
description = "Middleware do Agente de Portfólio - Metrô SP (g02)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # Persistência: interações, conversas, rotinas e jobstore do agendador
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Agendador das rotinas. O jobstore SQLAlchemy usa o mesmo PostgreSQL,
    # o que evita Redis ou outro broker só para a agenda.
    "apscheduler>=3.10,<4",
    # Fluxo Authorization Code + PKCE contra o Entra ID
    "msal>=1.28",
    # Assinatura do cookie de sessão
    "itsdangerous>=2.2",
    # Vetorização (Bag of Words / TF-IDF) da linha de base clássica do
    # classificador de intenção — ver pipeline/intencao/vetorizacao.py.
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

# Dependências do classificador de intenção em produção (embeddings +
# classificador supervisionado, ver Arquitetura.md seção 7) ainda serão
# adicionadas quando essa escolha for fechada. scikit-learn acima cobre só
# a linha de base clássica (TF-IDF/BoW) usada na comparação da feature F22.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
