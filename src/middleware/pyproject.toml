[project]
name = "middleware-pln"
version = "0.1.0"
description = "Camada de PLN entre o usuário e o Copilot Studio - Portfólio Metrô SP (g02)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

# Dependências de PLN (Presidio, spaCy, modelo de intenção) serão adicionadas
# quando a stack for definida na Sprint 2.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
