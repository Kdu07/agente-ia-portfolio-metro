# Sem build-system, `pip install -e .` não tem como construir o pacote e
# falha sem instalar nada — inclusive as dependências.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# O pacote é `app`; `dados/` e `tests/` ficam de fora do que se instala.
[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "middleware-pln"
version = "0.2.0"
description = "Middleware do Agente de Portfólio - Metrô SP (g02)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # Necessário para UploadFile/Form do endpoint multipart de áudio.
    "python-multipart>=0.0.9",
    # Persistência: interações, conversas, rotinas e jobstore do agendador
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    # O SQLAlchemyJobStore do APScheduler 3 é síncrono. A aplicação segue
    # usando asyncpg; somente o jobstore abre conexões com psycopg.
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Agendador das rotinas. O jobstore SQLAlchemy usa o mesmo PostgreSQL,
    # o que evita Redis ou outro broker só para a agenda.
    "apscheduler>=3.10,<4",
    # Validação do id_token do Entra ID (assinatura RS256 contra o JWKS do
    # tenant). A troca do código em si é um POST com o httpx acima — ver
    # a docstring de auth/entra.py sobre por que não o MSAL.
    "PyJWT[crypto]>=2.8",
    # Assinatura do cookie de sessão
    "itsdangerous>=2.2",
    # Classificador de intenção. scikit-learn cobre a vetorização
    # (BoW/TF-IDF) e os estimadores; sentence-transformers traz o modelo
    # de sentença multilíngue do ramo de embeddings; joblib serializa o
    # artefato treinado. Ver pipeline/intencao/modelo.py.
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "joblib>=1.4",
    # Reconhecimento de fala no backend. A integração isolada aceita WAV;
    # formatos comprimidos entram na etapa de processamento de áudio.
    "azure-cognitiveservices-speech>=1.51,<2",
    # Cliente AMQP assíncrono da mensageria (Projeto.md 9.1.2.6): publisher
    # confirms, reconexão e mandatory. Major fixada porque o produtor
    # depende das exceções de entrega da biblioteca.
    "aio-pika>=9.4,<10",
]

[project.optional-dependencies]
# Banco vetorial e ingestão do executor próprio. Extra, e não dependência
# base, porque o caminho oficial (executor=copilot) não indexa nada e não
# deve arrastar o SDK do provedor. O adaptador de reserva não aparece
# aqui: o pgvector é uma extensão do servidor, e rag/vetorial/pgvector.py
# fala apenas SQL pelo SQLAlchemy que já está na base.
rag = [
    # A major validada contra o índice real (`python -m
    # app.rag.vetorial.provisionar --validar`). A v9 reescreveu o SDK:
    # fixar a major impede que uma atualização mude a forma das respostas
    # debaixo do adaptador sem ninguém ver.
    "pinecone>=10,<11",
    # Leitura da pasta controlada do Drive, por conta de serviço.
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    # Extração dos formatos do corpus (app/rag/ingestao/extracao.py).
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    # Modelo de geração (decisão D3), atrás de app/rag/linguagem/. Major
    # fixada pelo mesmo motivo do SDK do índice: o adaptador lê a forma
    # da resposta (`.text`) e o código de erro (`.code`) do provedor.
    "google-genai>=2.23,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # A suíte de integração do webhook do Drive exercita encerramento e
    # renovação de canais, caminhos que tratam `googleapiclient.errors.HttpError`.
    # Mantê-lo no extra de desenvolvimento faz `pytest` reproduzível após o
    # comando de instalação documentado no README, mesmo sem instalar todo o RAG.
    "google-api-python-client>=2.100",
    # Cobertura e desempenho sistêmico (Projeto.md §10.1 e §10.2).
    # Os cenários de carga e micro-latência chegam no card de desempenho;
    # este extra mantém os instrumentos reproduzíveis no ambiente de dev.
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "locust>=2.31",
    "ruff>=0.5",
    # VHS (Projeto.md 10.5.4): grava uma vez a resposta real do serviço
    # externo e a reproduz nas execuções seguintes. vcrpy é o motor;
    # pytest-recording traz o marcador @pytest.mark.vcr, --record-mode e
    # --block-network.
    "pytest-recording>=0.13",
    "vcrpy>=6.0",
    "pytest-benchmark>=5.1",
    "locust>=2.32",
    # Banco em memória dos testes unitários das agregações do painel
    # (tests/unit/conftest.py). As consultas de app/analytics/ usam só
    # SQL portável, e o SQLite as exercita sem exigir um PostgreSQL de pé;
    # a conferência contra o servidor real fica na suíte de integração.
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Marcadores dos modos de execução de Projeto.md 10.5.6.1. Os grupos
# `banco` e `lento` chegam com as tasks de Testcontainers.
markers = [
    "integracao: costura entre componentes, e não função isolada",
    "externo: exercita integração externa sob fita VHS",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.ruff]
line-length = 100
